{% extends "base.html" %}
{% block titulo %}Recuperar contraseña · app-liquidar{% endblock %}
{% block contenido %}
<div style="max-width:380px;margin:60px auto 0;">
  <div class="tarjeta">
    <h1>Recuperar contraseña</h1>
    <p class="subtitulo">Te mandamos un link para elegir una nueva, válido por 1 hora.</p>
    <form method="POST">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus>
      <button type="submit" style="width:100%">Enviar link</button>
    </form>
  </div>
</div>
{% endblock %}
